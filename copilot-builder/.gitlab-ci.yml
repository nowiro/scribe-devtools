# .gitlab-ci.yml — the same gates as `npm run verify`, split into jobs so a red lint does not hide
# behind a long test run. Merge requests verify the AFFECTED projects; the default branch verifies
# everything; the nightly schedule adds the online checks (`check:upstream`, `npm audit`).
#
# Principles:
#   - npm is installed from cache (`.cache/npm`, keyed on package-lock.json); `.npmrc` already has
#     ignore-scripts=true, so `npm ci` is fast and runs no third-party install scripts.
#   - Every job that runs a tool with a cache carries ITS OWN cache key (`tools-<job>-<branch>`) with a
#     fallback to the default branch: GitLab keeps one archive per key and the last writer wins, so
#     two jobs sharing a key with different paths would keep erasing each other's cache. This is the
#     whole "cache without Nx Cloud" story: every tool has a cache of its own, GitLab carries it.
#     Caches of protected branches are kept apart from unprotected ones by GitLab itself.
#   - Build once; the e2e job consumes `dist/` as an artifact instead of rebuilding.
#   - Every job runs the exact `npm run …` a contributor runs locally — both halves where a gate has
#     a tooling half and a projects half (lint, typecheck, test).
#   - No secrets are needed for build or test. No publish job — release is a manual, tagged step.
#   - The image follows .nvmrc (Node 24). Bump both together; `doctor` reports the local mismatch.
#     Tags are mutable; pin by digest (`image: node:24-bookworm-slim@sha256:…`) once the team has a
#     registry mirror — docs/dev-setup.md says how.
#
# Self-hosted runners: add `tags: [<your-tag>]` in `default:` (or per job). Nothing here assumes a
# specific runner beyond docker executor + outbound access to the npm registry (or a mirror set via
# the npm_config_registry variable in the project's CI/CD settings).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG

default:
  image: node:24-bookworm-slim
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]
  before_script:
    - node --version
    - npm ci --prefer-offline --no-audit --no-fund
  cache:
    - key:
        files: [package-lock.json]
      paths: [.cache/npm]
      policy: pull

variables:
  CI: 'true'
  NG_CLI_ANALYTICS: 'false'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  NODE_NO_WARNINGS: '1'
  # affected.mjs diffs against the merge base — a shallow clone has no base to diff against.
  GIT_DEPTH: '0'
  FF_USE_FASTZIP: 'true'
  CACHE_COMPRESSION_LEVEL: fastest
  ARTIFACT_COMPRESSION_LEVEL: fastest
  # MR pipelines verify what changed; the default branch, schedules and tags verify everything.
  AFFECTED_FLAG: --all

stages: [install, verify, build, e2e, nightly]

# MR pipelines narrow every `affected` job to the merge base; everything else runs with --all.
.mr-affected: &mr-affected
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        AFFECTED_FLAG: --base=$CI_MERGE_REQUEST_DIFF_BASE_SHA
    - when: on_success

# The npm cache, always pulled by every job.
.npm-cache: &npm-cache
  key:
    files: [package-lock.json]
  paths: [.cache/npm]
  policy: pull

# Warms the npm cache once per pipeline; every other job pulls.
install:
  stage: install
  cache:
    - key:
        files: [package-lock.json]
      paths: [.cache/npm]
      policy: pull-push
  script:
    - echo "dependencies installed from cache-or-registry"

# The static gates: formatting, pins, Copilot config, SDD hygiene, tech-stack canon, code index,
# instruction sync, glossary, forbidden files. Under a minute, no compilation.
static:
  stage: verify
  needs: [install]
  script:
    - npm run verify -- --static

# Both halves of the lint gate: the repository's own tooling and configuration (`eslint .`), then
# the workspace projects the change touches.
lint:
  <<: *mr-affected
  stage: verify
  needs: [install]
  script:
    - npm run lint
    - npm run affected -- lint $AFFECTED_FLAG
  cache:
    - *npm-cache
    - key: tools-lint-$CI_COMMIT_REF_SLUG
      fallback_keys: [tools-lint-$CI_DEFAULT_BRANCH]
      paths: [.cache/eslint, .cache/tasks]
      policy: pull-push

typecheck:
  <<: *mr-affected
  stage: verify
  needs: [install]
  script:
    - npm run typecheck
    - npm run affected -- typecheck $AFFECTED_FLAG
  cache:
    - *npm-cache
    - key: tools-typecheck-$CI_COMMIT_REF_SLUG
      fallback_keys: [tools-typecheck-$CI_DEFAULT_BRANCH]
      paths: [.cache/tsc, .cache/tasks]
      policy: pull-push

# Unit tests of the tooling and the vendored scribe — one project, so the coverage badge below has one
# deterministic number (the projects job reports per project through Cobertura instead).
test:
  stage: verify
  needs: [install]
  script:
    - npm run test:cov -- --reporter=default --reporter=junit --outputFile=reports/junit-tools.xml
  coverage: '/Lines\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths: [reports/, coverage/tools/]
    reports:
      junit: [reports/junit-tools.xml]
      coverage_report:
        coverage_format: cobertura
        path: coverage/tools/cobertura-coverage.xml
  cache:
    - *npm-cache
    - key: tools-test-$CI_COMMIT_REF_SLUG
      fallback_keys: [tools-test-$CI_DEFAULT_BRANCH]
      paths: [.cache/vite]
      policy: pull-push

# Vitest of the Angular projects the change touches. affected.mjs sets CB_PROJECT per project, so the
# shared runner config writes reports/junit-<project>.xml and the builder writes coverage/<project>/.
test-projects:
  <<: *mr-affected
  stage: verify
  needs: [install]
  script:
    - npm run affected -- test $AFFECTED_FLAG
  artifacts:
    when: always
    expire_in: 1 week
    paths: [reports/, coverage/]
    reports:
      junit: [reports/junit-*.xml]
      coverage_report:
        coverage_format: cobertura
        path: coverage/*/cobertura-coverage.xml
  cache:
    - *npm-cache
    - key: tools-test-projects-$CI_COMMIT_REF_SLUG
      fallback_keys: [tools-test-projects-$CI_DEFAULT_BRANCH]
      paths: [.cache/vite, .cache/tasks, .angular/cache]
      policy: pull-push

build:
  <<: *mr-affected
  stage: build
  needs: [static, lint, typecheck, test, test-projects]
  script:
    - npm run affected -- build $AFFECTED_FLAG
  artifacts:
    expire_in: 1 day
    paths: [dist/]
  cache:
    - *npm-cache
    - key: tools-build-$CI_COMMIT_REF_SLUG
      fallback_keys: [tools-build-$CI_DEFAULT_BRANCH]
      paths: [.angular/cache]
      policy: pull-push

# Playwright runs on the official image whose browsers match the pinned @playwright/test. The tag
# follows the version in package.json; `check:pins` compares the two (the `tags` rule of the pin), so
# a bump of one without the other is red before this job ever runs. The generated Playwright configs
# write their junit to reports/ and traces to test-results/ at the repository root.
e2e:
  <<: *mr-affected
  stage: e2e
  needs: [build]
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  variables:
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
  script:
    - npm run affected -- e2e $AFFECTED_FLAG
  artifacts:
    when: always
    expire_in: 3 days
    paths: [reports/, test-results/]
    reports:
      junit: [reports/junit-e2e-*.xml]

# The online half of the currency doctrine: which pins fell behind `latest` and for how long.
# WARN-only — a report, not a gate; a human decides with `npm run check:upstream -- --ack`.
upstream:
  stage: nightly
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - npm run check:upstream
  allow_failure: true

# Known vulnerabilities in the runtime dependency tree. `.npmrc` turns the audit off for every install
# (offline, deterministic installs); this nightly job is where it runs — and it IS a gate.
audit:
  stage: nightly
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - npm audit --audit-level=high --omit=dev
