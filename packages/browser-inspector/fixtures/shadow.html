<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Shadow</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; }
    </style>
  </head>
  <body>
    <!--
      A login form inside an OPEN shadow root, with a label ending in a colon. `ariaSnapshot`
      walks shadow roots, so the fields are addressable by ref — the DOM walk behind `snap.json`
      and the element map must walk them too, or the password field arrives without `sensitive`
      and its value stays in snap.md / snap.full.yml (DESIGN.md §2.6, AC-10).

      TWO instances, with the SAME element ids inside their shadow roots: that is legal (each
      shadow root is its own tree) and it is what proves the element map checks uniqueness —
      Playwright's CSS pierces open shadow roots, so `#u` would be one selector for two elements.
      The `data-testid`s differ, so a step can still address one field on purpose.
    -->
    <h1>Logowanie (web component)</h1>
    <login-box></login-box>
    <login-box-two></login-box-two>
    <script>
      const markup = (/** @type {string} */ prefix) =>
        '<h2>Zaloguj</h2>' +
        '<p><label for="u">Użytkownik:</label> <input id="u" data-testid="' +
        prefix +
        '-user" /></p>' +
        '<p><label for="p">Hasło:</label> <input id="p" type="password" data-testid="' +
        prefix +
        '-pass" /></p>' +
        '<button id="go" data-testid="' +
        prefix +
        '-go">Zaloguj</button>';
      class LoginBox extends HTMLElement {
        connectedCallback() {
          this.attachShadow({ mode: 'open' }).innerHTML = markup('sd');
        }
      }
      class LoginBoxTwo extends HTMLElement {
        connectedCallback() {
          this.attachShadow({ mode: 'open' }).innerHTML = markup('sd2');
        }
      }
      customElements.define('login-box', LoginBox);
      customElements.define('login-box-two', LoginBoxTwo);
    </script>
  </body>
</html>
