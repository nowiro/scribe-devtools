<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Slow page</title>
</head>
<body>
<h1>Slow page</h1>
<p data-testid="status">loading…</p>
<ul data-testid="items"></ul>
<script>
  // One delayed XHR after `load`, then late DOM: `networkidle` waits 500 ms of silence after the
  // response, `settled` 100 ms — the difference AC-16 measures. `?delay=<ms>` sets the server delay
  // (default 300), `?poll=1` keeps polling forever so `settled` has to hit its cap.
  const params = new URLSearchParams(location.search);
  const delay = Number(params.get('delay') ?? 300);
  const poll = params.get('poll') === '1';
  const status = document.querySelector('[data-testid=status]');
  const fetchOnce = () =>
    fetch(`/slow?ms=${delay}`)
      .then((r) => r.text())
      .then((text) => {
        status.textContent = `loaded after ${text}`;
        const li = document.createElement('li');
        li.setAttribute('data-testid', 'late');
        li.textContent = 'late item';
        document.querySelector('[data-testid=items]').append(li);
      });
  window.addEventListener('load', () => {
    fetchOnce();
    if (poll) setInterval(() => fetch(`/slow?ms=50&t=${Date.now()}`), 80);
  });
</script>
</body>
</html>
