<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dialogs</title>
</head>
<body>
<h1>Dialogs</h1>
<button data-testid="alert">Alert</button>
<button data-testid="confirm">Confirm</button>
<button data-testid="prompt">Prompt</button>
<a href="form.html" data-testid="leave">Leave (beforeunload)</a>
<p data-testid="dialog-result">none</p>
<script>
  const out = document.querySelector('[data-testid=dialog-result]');
  document.querySelector('[data-testid=alert]').addEventListener('click', () => {
    alert('Uwaga!');
    out.textContent = 'alert closed';
  });
  document.querySelector('[data-testid=confirm]').addEventListener('click', () => {
    out.textContent = confirm('Usunąć?') ? 'confirm accepted' : 'confirm dismissed';
  });
  document.querySelector('[data-testid=prompt]').addEventListener('click', () => {
    const answer = prompt('Jak masz na imię?', 'anon');
    out.textContent = answer === null ? 'prompt dismissed' : `prompt: ${answer}`;
  });
  // `beforeunload` fires only after a user gesture on the page — the buttons above count as one.
  window.addEventListener('beforeunload', (event) => {
    event.preventDefault();
    event.returnValue = '';
  });
</script>
</body>
</html>
