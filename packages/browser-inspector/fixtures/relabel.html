<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Karta produktu</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; }
      label { display: block; margin: 6px 0; }
    </style>
  </head>
  <body>
    <!--
      A button whose label changes on click ("Dodaj do koszyka" → "W koszyku"): playwright-core
      computes a NEW ref when role or name change, so the old ref must fail fast with
      `ref not found` even though the element is the same (DESIGN.md §4.2). The form below gives
      the box-join one element per selector preference (data-testid, #id, [name], nothing durable)
      and two sensitive fields that never carry a value in snap.md / snap.json.
    -->
    <h1>Karta produktu</h1>
    <article aria-label="Harry Potter i Kamień Filozoficzny">
      <h2>Harry Potter i Kamień Filozoficzny</h2>
      <p>J.K. Rowling · 1997</p>
      <button id="add" data-testid="card-add-to-cart" type="button">Dodaj do koszyka</button>
      <output id="cart-count" aria-live="polite">0</output>
    </article>
    <form>
      <label>E-mail <input type="email" data-testid="field-email" placeholder="jan@example.com" /></label>
      <label>Imię <input id="first-name" type="text" /></label>
      <label>Miasto <input type="text" name="city" /></label>
      <label>Hasło <input type="password" name="password" /></label>
      <label>Kod jednorazowy <input type="text" autocomplete="one-time-code" name="otp" /></label>
      <label><input type="checkbox" name="consent" /> Zgoda na regulamin</label>
      <button type="button">Bez identyfikatora</button>
    </form>
    <script>
      let count = 0;
      const add = document.getElementById('add');
      add.addEventListener('click', () => {
        count += 1;
        document.getElementById('cart-count').textContent = String(count);
        add.textContent = 'W koszyku';
      });
    </script>
  </body>
</html>
