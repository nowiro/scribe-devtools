<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Drag</title>
<style>
  .box { width: 160px; height: 80px; border: 2px dashed #888; margin: 1rem; display: inline-block; text-align: center; line-height: 80px; }
  .item { width: 120px; height: 40px; background: #cde; margin: 1rem; text-align: center; line-height: 40px; cursor: grab; }
</style>
</head>
<body>
<h1>Drag</h1>
<div class="item" draggable="true" data-testid="drag-source" id="item-a">Item A</div>
<div class="box" data-testid="drop-target" id="target">Drop here</div>
<p data-testid="drop-result">nothing dropped</p>
<script>
  const source = document.querySelector('[data-testid=drag-source]');
  const target = document.querySelector('[data-testid=drop-target]');
  source.addEventListener('dragstart', (event) => {
    event.dataTransfer.setData('text/plain', source.id);
  });
  target.addEventListener('dragover', (event) => event.preventDefault());
  target.addEventListener('drop', (event) => {
    event.preventDefault();
    const id = event.dataTransfer.getData('text/plain');
    document.querySelector('[data-testid=drop-result]').textContent = `dropped: ${id}`;
    target.textContent = 'Got it';
  });
</script>
</body>
</html>
