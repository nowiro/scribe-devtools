<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Upload</title>
</head>
<body>
<h1>Upload</h1>
<label>Files <input type="file" data-testid="file" multiple /></label>
<ul data-testid="files"></ul>
<p data-testid="count">0 files</p>
<script>
  const input = document.querySelector('[data-testid=file]');
  input.addEventListener('change', () => {
    const list = document.querySelector('[data-testid=files]');
    list.replaceChildren();
    for (const file of input.files) {
      const li = document.createElement('li');
      li.textContent = `${file.name} (${file.size} B)`;
      list.append(li);
    }
    document.querySelector('[data-testid=count]').textContent = `${input.files.length} files`;
  });
</script>
</body>
</html>
