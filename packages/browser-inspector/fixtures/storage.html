<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Storage</title>
</head>
<body>
<h1>Storage</h1>
<button data-testid="set">Set storage</button>
<button data-testid="nav">Push history</button>
<pre data-testid="state">…</pre>
<p data-testid="history">…</p>
<script>
  // Shows what a run can see from the previous one: localStorage, sessionStorage, the cookie and
  // history.length. The isolation smoke sets all three on two origins in run A and expects run B
  // to see none of them. `__bi_gen` (the generation marker) is the one key the engine leaves.
  const render = () => {
    const ls = localStorage.getItem('bi-local') ?? '';
    const ss = sessionStorage.getItem('bi-session') ?? '';
    const cookie = document.cookie.split(';').map((c) => c.trim()).find((c) => c.startsWith('bi-cookie=')) ?? '';
    document.querySelector('[data-testid=state]').textContent = JSON.stringify({ ls, ss, cookie });
    document.querySelector('[data-testid=history]').textContent = `history ${history.length}`;
  };
  document.querySelector('[data-testid=set]').addEventListener('click', () => {
    localStorage.setItem('bi-local', `L@${location.port}`);
    sessionStorage.setItem('bi-session', `S@${location.port}`);
    document.cookie = `bi-cookie=C@${location.port}; path=/`;
    render();
  });
  document.querySelector('[data-testid=nav]').addEventListener('click', () => {
    history.pushState({}, '', `?entry=${history.length}`);
    render();
  });
  render();
</script>
</body>
</html>
